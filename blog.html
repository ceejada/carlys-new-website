<!DOCTYPE html>
<html>
<head>
    <title>Blog - Carly J Adams</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav>
  <a href="index.html">Home</a>
  <a href="blog.html">Blog</a>
  <a href="portfolio.html">Portfolio</a>
  <a href="corkboard.html">Corkboard</a>
</nav>  

<h1>Blog</h1>
<hr class="dashed">
<p>Welcome to the blog! This is a casual place for me to post anything I'm working on. I am also working on a backlog of older projects that might make it on here. There's a lot going on here right now so feel free to narrow it down. </p>

<!-- buttons! -->
<div class="button-container">
    <button class="button button1" data-filter="personal">personal</button>
    <button class="button button1" data-filter="professional">professional</button>
</div>

<div class="button-container">
    <button class="button button1" data-status="wip">wip</button>
    <button class="button button1" data-status="archive">archive</button>
</div>

<!-- consider coming back here later to add archive/rambling/wip tags and have them look different stylistically
-->
<hr class="dashed">

<div id="blog-posts-container"></div>

<!-- automatic blog assigning -->
<script>
    const postList = [
    {
        file: "posts/capstone.html",
        tags: "professional wip"
    },
    {
        file: "posts/vp.html",
        tags: "professional archive"
    },
    {
        file: "posts/dit.html",
        tags: "professional archive"
    },    
    {
        file: "posts/maps.html",
        tags: "professional archive"
    },    
    {
        file: "posts/chair.html",
        tags: "personal archive"
    },
    ];

    const container = document.getElementById("blog-posts-container");

    postList.forEach(post => {

    fetch(post.file)
        .then(response => response.text())
        .then(html => {

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");

        const title = doc.querySelector("h1")?.innerText || "Untitled";
        const paragraph = doc.querySelector("h6")?.innerText || "";
        const image = doc.querySelector("img")?.getAttribute("src") || "";
        const date = doc.querySelector("h7")?.innerText || "";

        const card = document.createElement("article");

        card.classList.add("blog-post-card");
        card.dataset.tags = post.tags;

        card.innerHTML = `
        ${image ? `<img class="blog-thumb" src="${image}">` : ""}
        <div class="blog-text">
            <h2><a href="${post.file}">${title}</a></h2>
            <h3>${date}</h3>
            <p>${paragraph}</p>

            <div class="tags">
                Tags: <span>${post.tags}</span>
            </div>
        </div>
        `;
        container.appendChild(card);
        });
    });

</script>

<!-- personal/professional sorting -->
<script>

let activeType = null;
let activeStatus = null;

const typeButtons = document.querySelectorAll("[data-filter]");
const statusButtons = document.querySelectorAll("[data-status]");

function filterPosts() {
  const posts = document.querySelectorAll(".blog-post-card");

  posts.forEach(post => {
    const tags = post.dataset.tags;

    const typeMatch = !activeType || tags.includes(activeType);
    const statusMatch = !activeStatus || tags.includes(activeStatus);

    post.style.display = (typeMatch && statusMatch) ? "" : "none";
  });
}

// TYPE FILTER
typeButtons.forEach(button => {
  button.addEventListener("click", () => {

    const filter = button.dataset.filter;

    if (activeType === filter) {
      activeType = null;
      button.classList.remove("active");
    } else {

      typeButtons.forEach(b => b.classList.remove("active"));
      button.classList.add("active");

      activeType = (filter === "everything") ? null : filter;
    }

    filterPosts();
  });
});

// STATUS FILTER
statusButtons.forEach(button => {
  button.addEventListener("click", () => {

    const status = button.dataset.status;

    if (activeStatus === status) {
      activeStatus = null;
      button.classList.remove("active");
    } else {

      statusButtons.forEach(b => b.classList.remove("active"));
      button.classList.add("active");

      activeStatus = status;
    }

    filterPosts();
  });
});

</script>

</body>
</html>
